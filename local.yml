version: '3'

services:
  django:
    image: registry.cn-hangzhou.aliyuncs.com/charles0519/music_tag_web:latest
    container_name: music-tag-web
    expose:
      - "8001"
    volumes:
      - /Users/macbookair/Music/my_music:/app/media:z # 配置本地音乐文件夹
    restart: always
    environment:
      dockerrun: "yes"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set a unique DJANGO_SECRET_KEY}"
    depends_on:
      - redis
      - db
    networks:
      - internal
    command: /start
  celeryworker:
    image: registry.cn-hangzhou.aliyuncs.com/charles0519/music_tag_web:latest
    container_name: music_celeryworker
    environment:
      dockerrun: "yes"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set a unique DJANGO_SECRET_KEY}"
    ports: [ ]
    volumes:
      - /Users/macbookair/Music/my_music:/app/media:z # 配置本地音乐文件夹
    networks:
      - internal
    depends_on:
      - redis
      - db
    command: /start-celeryworker
  celerybeat:
    image: registry.cn-hangzhou.aliyuncs.com/charles0519/music_tag_web:latest
    container_name: music_celerybeat
    environment:
      dockerrun: "yes"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set a unique DJANGO_SECRET_KEY}"
    ports: [ ]
    networks:
      - internal
    depends_on:
      - redis
      - db
    command: /start-celerybeat
  redis:
    image: redis:latest
    restart: always
    container_name: music_redis
    networks:
      - internal
    expose:
      - "6379"
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: music3
      MYSQL_ROOT_PASSWORD: 123456
    networks:
      - internal
    expose:
      - "3306"
  nginx:
    image: nginx:latest
    restart: always
    container_name: music_nginx
    ports:
      - "9150:80"
    networks:
      - internal
    depends_on:
      - django
    volumes:
      - /Users/macbookair/Music/nginx.conf:/etc/nginx/nginx.conf:ro # 配置nginx.conf
      - /Users/macbookair/Music/my_music:/app/media:z # 配置本地音乐文件夹
networks:
  internal:
